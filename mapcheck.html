<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>지도 검증 · 시티 드라이브</title>
<style>
  html, body { margin: 0; height: 100%; background: #20242a; color: #e8eaed; font: 14px/1.5 system-ui, "Malgun Gothic", sans-serif; overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; cursor: grab; }
  .bar { position: fixed; left: 12px; top: 12px; padding: 10px 14px; border-radius: 10px; background: rgba(20, 24, 30, 0.88); border: 1px solid rgba(255, 255, 255, 0.15); max-width: 360px; }
  .bar h1 { margin: 0 0 6px; font-size: 15px; }
  .bar label { display: block; }
  .bar small { color: #9aa3ad; }
  .credit { position: fixed; right: 8px; bottom: 6px; font-size: 11px; color: #cfd4da; background: rgba(20, 24, 30, 0.7); padding: 2px 6px; border-radius: 4px; }
  .credit a { color: inherit; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div class="bar">
  <h1>지도 검증</h1>
  <label><input id="tiles" type="checkbox" checked> 실제 지도(오픈스트리트맵) 밑그림</label>
  <label><input id="roads" type="checkbox" checked> 게임의 차도 <span style="color:#ff5a4d">■</span> · 보행로 <span style="color:#ffb547">■</span></label>
  <label><input id="buildings" type="checkbox" checked> 게임의 건물 <span style="color:#4da3ff">■</span> (가까이 확대하면 표시)</label>
  <small id="where"></small><br>
  <small>드래그: 이동 · 휠: 확대. 게임에 쓰인 지도 자료를 실제 지도 위에 겹쳐 어긋남을 눈으로 확인하는 화면입니다.</small>
</div>
<div class="credit">밑그림 © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> 기여자</div>
<script type="module">
// The game's map laid over the real one, to see by eye where they disagree. Nothing here is part of the game:
// it is opened from the development server (npm run dev, then /mapcheck.html) and is not published.
const canvas = document.getElementById('view'), g = canvas.getContext('2d'), $ = id => document.getElementById(id);
const base = await (await fetch('map/haeundae/base.json')).json();
const { center, mPerLat, mPerLon, rect, zone: ZONE, cols, rows } = base.meta, bare = new Set(base.meta.bare || []);
// local metres <-> web-mercator "world pixels" at zoom 0 (256 px across the world)
const toGeo = (x, z) => [center.lat - z / mPerLat, center.lon + x / mPerLon];
const worldX = lon => (lon + 180) / 360 * 256, worldY = lat => (1 - Math.asinh(Math.tan(lat * Math.PI / 180)) / Math.PI) / 2 * 256;
const view = { x: (rect[0] + rect[2]) / 2, z: (rect[1] + rect[3]) / 2, scale: 0.08 };       // centre in metres, pixels per metre
const tiles = new Map(), zones = new Map();
const tile = (z, x, y) => {
  const key = `${z}/${x}/${y}`;
  if (!tiles.has(key)) { const img = new Image(); img.crossOrigin = 'anonymous'; img.onload = draw; img.src = `https://tile.openstreetmap.org/${key}.png`; tiles.set(key, img); }
  return tiles.get(key);
};
const zoneData = (i, j) => {
  const key = j * cols + i;
  if (bare.has(key) || i < 0 || j < 0 || i >= cols || j >= rows) return null;
  if (!zones.has(key)) { zones.set(key, null); fetch(`map/haeundae/z_${i}_${j}.json`).then(r => r.json()).then(d => { zones.set(key, d); draw(); }, () => {}); }
  return zones.get(key);
};
// drawn at most once a frame, however many tiles arrive
let queued = false;
function draw() { if (!queued) { queued = true; requestAnimationFrame(() => { queued = false; paint(); }); } }
function paint() {
  const w = Math.round(innerWidth * devicePixelRatio), h = Math.round(innerHeight * devicePixelRatio), s = view.scale * devicePixelRatio;
  if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
  g.fillStyle = '#20242a';
  g.fillRect(0, 0, w, h);
  const sx = x => (x - view.x) * s + w / 2, sz = z => (z - view.z) * s + h / 2;
  if ($('tiles').checked) {
    // the zoom whose tiles come out nearest their own size
    const [lat, lon] = toGeo(view.x, view.z), mPerPx0 = 40075016.686 * Math.cos(lat * Math.PI / 180) / 256;
    const zoom = Math.max(11, Math.min(18, Math.round(Math.log2(mPerPx0 * s)))), n = 2 ** zoom;
    const [latA, lonA] = toGeo(view.x - w / 2 / s, view.z - h / 2 / s), [latB, lonB] = toGeo(view.x + w / 2 / s, view.z + h / 2 / s);
    for (let tx = Math.floor(worldX(lonA) / 256 * n); tx <= Math.floor(worldX(lonB) / 256 * n); tx++) {
      for (let ty = Math.floor(worldY(latA) / 256 * n); ty <= Math.floor(worldY(latB) / 256 * n); ty++) {
        const img = tile(zoom, tx, ty);
        if (!img.complete || !img.naturalWidth) continue;
        // the tile's corners in local metres (the projection is close enough to straight over one tile)
        const lon0 = tx / n * 360 - 180, lon1 = (tx + 1) / n * 360 - 180;
        const latOf = y => Math.atan(Math.sinh(Math.PI * (1 - 2 * y / n))) * 180 / Math.PI, lat0 = latOf(ty), lat1 = latOf(ty + 1);
        const x0 = sx((lon0 - center.lon) * mPerLon), x1 = sx((lon1 - center.lon) * mPerLon), y0 = sz((center.lat - lat0) * mPerLat), y1 = sz((center.lat - lat1) * mPerLat);
        g.globalAlpha = 0.85;
        g.drawImage(img, x0, y0, x1 - x0, y1 - y0);
        g.globalAlpha = 1;
      }
    }
  }
  const line = (p, close) => { g.beginPath(); g.moveTo(sx(p[0]), sz(p[1])); for (let i = 2; i < p.length; i += 2) g.lineTo(sx(p[i]), sz(p[i + 1])); if (close) g.closePath(); };
  if ($('buildings').checked && view.scale > 0.5) {
    g.strokeStyle = '#4da3ff';
    g.fillStyle = 'rgba(77, 163, 255, 0.18)';
    g.lineWidth = 1.2 * devicePixelRatio;
    const i0 = Math.floor((view.x - w / 2 / s - rect[0]) / ZONE), i1 = Math.floor((view.x + w / 2 / s - rect[0]) / ZONE), j0 = Math.floor((view.z - h / 2 / s - rect[1]) / ZONE), j1 = Math.floor((view.z + h / 2 / s - rect[1]) / ZONE);
    for (let i = i0; i <= i1; i++) for (let j = j0; j <= j1; j++) for (const b of zoneData(i, j)?.b || []) { line(b.p, true); g.fill(); g.stroke(); }
  }
  if ($('roads').checked) {
    g.lineCap = g.lineJoin = 'round';
    for (const r of base.roads) {
      g.strokeStyle = r.c === 'drive' ? (r.br ? '#c13cff' : r.tn ? '#35c9a5' : '#ff5a4d') : '#ffb547';
      g.globalAlpha = r.c === 'drive' ? 0.75 : 0.6;
      g.lineWidth = Math.max(1.2 * devicePixelRatio, (r.c === 'drive' ? r.w : 1.5) * s);
      line(r.p);
      g.stroke();
    }
    g.globalAlpha = 1;
  }
  g.strokeStyle = '#ffffff';
  g.setLineDash([8, 6]);
  g.lineWidth = devicePixelRatio;
  g.strokeRect(sx(rect[0]), sz(rect[1]), (rect[2] - rect[0]) * s, (rect[3] - rect[1]) * s);
  g.setLineDash([]);
  const [lat, lon] = toGeo(view.x, view.z);
  $('where').textContent = `가운데: ${lat.toFixed(5)}, ${lon.toFixed(5)} (게임 좌표 ${Math.round(view.x)}, ${Math.round(view.z)}) · 차도 ${base.stats.roads.driveKm}km · 건물 ${base.stats.buildings.mapped}동`;
}
let drag = null;
canvas.addEventListener('mousedown', e => { drag = [e.clientX, e.clientY]; });
addEventListener('mouseup', () => { drag = null; });
addEventListener('mousemove', e => { if (!drag) return; view.x -= (e.clientX - drag[0]) / view.scale; view.z -= (e.clientY - drag[1]) / view.scale; drag = [e.clientX, e.clientY]; draw(); });
canvas.addEventListener('wheel', e => { e.preventDefault(); view.scale = Math.max(0.03, Math.min(8, view.scale * Math.exp(-e.deltaY * 0.0015))); draw(); }, { passive: false });
addEventListener('resize', draw);
for (const id of ['tiles', 'roads', 'buildings']) $(id).addEventListener('change', draw);
draw();
</script>
</body>
</html>
